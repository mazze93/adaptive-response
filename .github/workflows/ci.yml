name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest # GitHub-hosted — never blocked by self-hosted runner
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        # --no-frozen-lockfile so pnpm.overrides resolve without requiring a
        # pre-committed lockfile regeneration (matches security.yml).
        run: pnpm install --no-frozen-lockfile

      - name: Build and typecheck
        # Builds packages/schema→sdk→ui first (typecheck depends on their dist).
        run: pnpm build && pnpm typecheck

      - name: Test
        run: pnpm test
