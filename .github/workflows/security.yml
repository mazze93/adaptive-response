name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

# Always use GitHub-hosted runners so Dependabot alerts
# and security scans are never blocked by self-hosted runner availability.
jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest   # GitHub-hosted — never blocked by self-hosted runner
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        # Fail on every reported severity; no advisory suppressions.
        run: pnpm audit --audit-level=low
        continue-on-error: false

      - name: Check every resolved esbuild version
        run: python3 scripts/check-esbuild.py

      - name: Test dependency validation regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
