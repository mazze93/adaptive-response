name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

# Always use GitHub-hosted runners so Dependabot alerts
# and security scans are never blocked by self-hosted runner availability.
jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest   # GitHub-hosted — never blocked by self-hosted runner
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        # Use --no-frozen-lockfile so pnpm.overrides can resolve without
        # requiring a pre-committed lockfile regeneration in CI.
        run: pnpm install --no-frozen-lockfile

      - name: Run pnpm audit
        # Fail on high/critical; allow moderate (adjust as needed)
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Check esbuild version is patched
        # Ensure pnpm.overrides is resolving esbuild to >=0.25.0
        run: |
          ESBUILD_VER=$(pnpm ls esbuild --depth=Infinity 2>/dev/null | grep ' esbuild ' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | head -1)
          echo "Resolved esbuild: $ESBUILD_VER"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$ESBUILD_VER"
          if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 25 ]; then
            echo "ERROR: esbuild $ESBUILD_VER is below 0.25.0 — CVE not patched!"
            exit 1
          fi
          echo "OK: esbuild $ESBUILD_VER >= 0.25.0"
