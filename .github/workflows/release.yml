name: Release

# Publishes the public packages (@adaptive-response/{schema,core,sdk,ui}) to
# npm via **trusted publishing** (OIDC) — no long-lived npm tokens anywhere
# (ADR 0004). npm v12 deprecates 2FA-bypass granular access tokens for direct
# publishing (fully removed ~Jan 2027), so OIDC is the only lane worth wiring.
#
# One-time prerequisites (manual, on npmjs.com — see ADR 0004):
#   1. Create the `adaptive-response` org.
#   2. First-publish each package once (interactive, with 2FA), or create it
#      via the UI, since a trusted publisher can only be configured on an
#      existing package.
#   3. On each package: Settings → Trusted Publisher → GitHub Actions, with
#      repository `mazze93/adaptive-response` and workflow `release.yml`.
#
# Publishing is idempotent: versions that already exist on the registry are
# skipped, so re-running a release after a partial failure is safe.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # OIDC token exchange for npm trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish midway

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest # GitHub-hosted — required for npm's OIDC issuer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (trusted publishing + provenance need a current CLI)
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        # --no-frozen-lockfile so pnpm.overrides resolve without requiring a
        # pre-committed lockfile regeneration (matches ci.yml).
        run: pnpm install --no-frozen-lockfile

      - name: Build, typecheck, test
        run: pnpm build && pnpm typecheck && pnpm test

      - name: Publish public packages
        # Dependency order (schema → core/sdk → ui) so a mid-run failure never
        # leaves a published package pointing at an unpublished dependency.
        run: |
          set -euo pipefail
          for pkg in schema core sdk ui; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published — skipping"
            else
              echo "Publishing $name@$version"
              (cd "packages/$pkg" && npm publish --provenance --access public)
            fi
          done
